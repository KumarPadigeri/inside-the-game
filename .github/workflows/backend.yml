# Test, build and deploy the backend to Azure Container Apps on every push to main that touches it.
#
# GitHub logs in to Azure with OpenID Connect: Azure trusts this repo's main branch directly, so no
# password is stored. The identity can only push images to the registry and update this one app.
name: Deploy backend

on:
  push:
    branches: [main]
    paths: ["inside_the_game/**", "tests/**", "Dockerfile", "pyproject.toml", ".github/workflows/backend.yml"]
  workflow_dispatch:

# Never run two deployments at once; the newest push wins.
concurrency:
  group: deploy-backend
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # lets the job request an OIDC token to log in to Azure

env:
  REGISTRY: insidethegameacr.azurecr.io
  IMAGE: inside-the-game-api
  RESOURCE_GROUP: rg-inside-the-game
  CONTAINER_APP: inside-the-game-api

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install ".[dev]"
      - run: pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure (OIDC, no secrets)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push the image, tagged with the commit
        run: |
          TAG="${GITHUB_SHA::7}"
          az acr login --name "${REGISTRY%%.*}"
          docker build -t "$REGISTRY/$IMAGE:$TAG" .
          docker push "$REGISTRY/$IMAGE:$TAG"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Deploy to Container Apps
        run: |
          az containerapp update \
            --name "$CONTAINER_APP" --resource-group "$RESOURCE_GROUP" \
            --image "$REGISTRY/$IMAGE:$TAG" --output none
          echo "Deployed $IMAGE:$TAG" >> "$GITHUB_STEP_SUMMARY"

      - name: Check the live API
        run: |
          URL="https://$(az containerapp show --name "$CONTAINER_APP" --resource-group "$RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn --output tsv)"
          for attempt in $(seq 1 20); do
            if curl --silent --fail --max-time 30 "$URL/api/health"; then echo; exit 0; fi
            sleep 10
          done
          echo "The API did not become healthy" && exit 1
